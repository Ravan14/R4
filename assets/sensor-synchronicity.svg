<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" role="img" aria-labelledby="sync-title sync-description"><title id="sync-title">Sensor modalities versus synchronicity</title><desc id="sync-description">The categorical vertical axis lists SAR, electro-optical, thermal infrared and cooperative RF. The horizontal axis increases in temporal coordination from independent single-modality observations through sequential tip-and-cue to a synchronised multimodal concept. Positions are illustrative, not measured scores. All modality families are shown for comparison, not as a claim that all systems carry all sensors.</desc><rect width="1060" height="540" fill="#081c2b"/><g font-family="Arial, sans-serif" font-size="14" fill="#bdd6e3"><text x="50" y="45" fill="#a0e8dc" font-size="13" letter-spacing="2">MODALITY × TEMPORAL COORDINATION</text><text x="50" y="75" font-size="12">Qualitative architecture comparison · no numerical performance ranking</text><text x="40" y="285" transform="rotate(-90 40 285)" font-size="12">SENSOR MODALITIES</text><text x="190" y="155" text-anchor="end">SAR</text><path d="M220 150H990" stroke="#294a60" stroke-dasharray="3 5"/><text x="190" y="235" text-anchor="end">Electro-optical</text><path d="M220 230H990" stroke="#294a60" stroke-dasharray="3 5"/><text x="190" y="315" text-anchor="end">Thermal infrared</text><path d="M220 310H990" stroke="#294a60" stroke-dasharray="3 5"/><text x="190" y="395" text-anchor="end">Cooperative RF</text><path d="M220 390H990" stroke="#294a60" stroke-dasharray="3 5"/><path d="M220 110V440H1000l-8-5m8 5-8 5" stroke="#83a9bb" fill="none"/><text x="600" y="518" text-anchor="middle" fill="#a0e8dc" font-size="13" letter-spacing="1">INCREASING SYNCHRONICITY / TEMPORAL COORDINATION →</text><g class="chart-point" data-series="single" stroke="#90a6b9" fill="#90a6b9"><circle cx="300" cy="150" r="9"/><circle cx="300" cy="150" r="17" fill="none" opacity=".25"/><circle cx="335" cy="230" r="9"/><circle cx="335" cy="230" r="17" fill="none" opacity=".25"/><circle cx="278" cy="310" r="9"/><circle cx="278" cy="310" r="17" fill="none" opacity=".25"/><circle cx="320" cy="390" r="9"/><circle cx="320" cy="390" r="17" fill="none" opacity=".25"/></g><g class="chart-point" data-series="sequential" stroke="#eab77b" fill="#eab77b"><path d="M530 150 L585 230 L640 310 L675 390" fill="none" stroke-dasharray="6 5"/><circle cx="530" cy="150" r="9"/><circle cx="530" cy="150" r="17" fill="none" opacity=".25"/><circle cx="585" cy="230" r="9"/><circle cx="585" cy="230" r="17" fill="none" opacity=".25"/><circle cx="640" cy="310" r="9"/><circle cx="640" cy="310" r="17" fill="none" opacity=".25"/><circle cx="675" cy="390" r="9"/><circle cx="675" cy="390" r="17" fill="none" opacity=".25"/></g><g class="chart-point" data-series="synchronous" stroke="#9fe7d6" fill="#9fe7d6"><rect x="870" y="120" width="60" height="300" rx="15" fill="#9fe7d6" fill-opacity=".08" stroke-opacity=".3"/><path d="M900 150V390" stroke-width="2"/><circle cx="900" cy="150" r="9"/><circle cx="900" cy="150" r="17" fill="none" opacity=".25"/><circle cx="900" cy="230" r="9"/><circle cx="900" cy="230" r="17" fill="none" opacity=".25"/><circle cx="900" cy="310" r="9"/><circle cx="900" cy="310" r="17" fill="none" opacity=".25"/><circle cx="900" cy="390" r="9"/><circle cx="900" cy="390" r="17" fill="none" opacity=".25"/></g><text x="310" y="466" text-anchor="middle" font-size="13">Single-modality</text><text x="310" y="487" text-anchor="middle" font-size="10" fill="#819eaf">Independent observations</text><text x="605" y="466" text-anchor="middle" font-size="13">Sequential tip-and-cue</text><text x="605" y="487" text-anchor="middle" font-size="10" fill="#819eaf">Variable acquisition offsets</text><text x="900" y="466" text-anchor="middle" font-size="13">R4 synchronised concept</text><text x="900" y="487" text-anchor="middle" font-size="10" fill="#819eaf">Coordinated event window</text></g></svg>